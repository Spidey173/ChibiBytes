{% extends "main-app.html" %}

{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChibiBytes - Anime Movies</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        .page-header {
            padding: 35px 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(192, 57, 43, 0.14) 0%, rgba(26, 18, 16, 0.65) 100%);
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .page-header::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #c0392b, #ff6b35, #c0392b);
            background-size: 200% auto;
            animation: shimmerLine 3s linear infinite;
        }

        @keyframes shimmerLine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .page-title {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #ede0d4;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-weight: 800;
        }

        .page-title i {
            color: #e74c3c;
            
        }

        .page-subtitle {
            font-size: 1.05rem;
            max-width: 700px;
            margin: 0 auto 25px;
            color: #a39080;
            line-height: 1.6;
        }

        /* ══════════════════════════════════════════════════════════════
           NETFLIX CINEMATIC HERO BILLBOARD
           ══════════════════════════════════════════════════════════════ */
        .netflix-hero-billboard {
            position: relative;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto 45px;
            min-height: 520px;
            height: clamp(500px, 58vh, 640px);
            border-radius: 20px;
            overflow: hidden;
            background: #0d0d0d;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(192, 57, 43, 0.15);
        }

        .hero-billboard-slides {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .hero-billboard-slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 40px 60px;
            z-index: 1;
        }

        .hero-billboard-slide.active {
            opacity: 1;
            visibility: visible;
            z-index: 2;
        }

        /* Landscape Cinematic Backdrop */
        .billboard-backdrop {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center 25%;
            transform: scale(1.02);
            transition: transform 6s ease-out;
            z-index: 0;
        }

        .hero-billboard-slide.active .billboard-backdrop {
            transform: scale(1.08);
        }

        /* Netflix Multidirectional Dark Vignettes */
        .billboard-vignette-h {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, 
                rgba(13, 13, 13, 0.98) 0%, 
                rgba(13, 13, 13, 0.92) 35%, 
                rgba(13, 13, 13, 0.5) 65%, 
                rgba(13, 13, 13, 0.15) 100%);
            z-index: 1;
        }

        .billboard-vignette-v {
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, 
                #0d0d0d 0%, 
                rgba(13, 13, 13, 0.6) 20%, 
                transparent 50%, 
                rgba(13, 13, 13, 0.5) 100%);
            z-index: 1;
        }

        /* Billboard Content */
        .billboard-content {
            position: relative;
            z-index: 2;
            max-width: 620px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            animation: heroFadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes heroFadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .billboard-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .badge-tag {
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            color: white;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 6px;
            box-shadow: 0 4px 14px rgba(192, 57, 43, 0.4);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-studio {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ede0d4;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .billboard-title {
            font-size: clamp(2.2rem, 4.2vw, 3.4rem);
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.85);
            margin: 0;
        }

        .billboard-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            color: #a39080;
            margin-top: 2px;
        }

        .meta-rating {
            color: #ffd700;
            font-weight: 800;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .meta-year {
            color: #ede0d4;
            font-weight: 600;
        }

        .meta-quality {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            padding: 2px 7px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .meta-eps {
            color: #ede0d4;
            font-weight: 500;
        }

        .meta-genres {
            color: #ff6b35;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .billboard-synopsis {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #c8c0b8;
            margin: 4px 0 16px 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
            max-width: 580px;
        }

        /* Netflix Action Buttons */
        .billboard-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn-netflix-play {
            background: #ffffff;
            color: #0d0d0d;
            font-weight: 800;
            font-size: 1rem;
            padding: 13px 28px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
        }

        .btn-netflix-play i {
            color: #c0392b;
            font-size: 1.1rem;
        }

        .btn-netflix-play:hover {
            background: #e6e6e6;
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.25);
        }

        .btn-netflix-info {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 13px 24px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
        }

        .btn-netflix-info:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.04);
        }

        .btn-netflix-list {
            background: rgba(13, 13, 13, 0.6);
            backdrop-filter: blur(10px);
            color: #ede0d4;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 13px 22px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
        }

        .btn-netflix-list:hover {
            background: rgba(192, 57, 43, 0.25);
            border-color: rgba(255, 107, 53, 0.4);
            color: white;
            transform: scale(1.04);
        }

        .btn-netflix-list.in-watchlist {
            background: rgba(46, 204, 113, 0.2);
            border-color: #2ecc71;
            color: #2ecc71;
        }

        /* Right Side Showcase Poster Card (100% Uncropped!) */
        .billboard-showcase-poster {
            position: relative;
            z-index: 2;
            flex-shrink: 0;
            width: 230px;
            aspect-ratio: 2 / 3;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.85), 0 0 35px rgba(192, 57, 43, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.18);
            display: block;
            cursor: pointer;
            background: #141414;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease;
        }

        .billboard-showcase-poster:hover {
            transform: scale(1.05) rotate(1deg);
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.9), 0 0 45px rgba(255, 107, 53, 0.4);
        }

        .billboard-showcase-poster img {
            width: 100%;
            height: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            display: block;
        }

        /* Netflix Floating Nav Chevrons */
        .hero-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            background: rgba(13, 13, 13, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 1.1rem;
        }

        .hero-nav:hover {
            background: rgba(192, 57, 43, 0.8);
            border-color: rgba(255, 107, 53, 0.6);
            transform: translateY(-50%) scale(1.12);
            box-shadow: 0 0 20px rgba(192, 57, 43, 0.5);
        }

        .hero-nav.prev { left: 20px; }
        .hero-nav.next { right: 20px; }

        .hero-nav i,
        .slider-nav i {
            pointer-events: none;
        }

        /* Netflix Animated Pill Progress Indicators */
        .hero-indicators {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        .hero-indicator-pill {
            width: 24px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.25);
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
            position: relative;
        }

        .hero-indicator-pill.active {
            width: 44px;
            background: #e74c3c;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.6);
        }

        .section {
            margin-bottom: 45px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.45rem;
            margin-bottom: 16px;
            color: #ede0d4;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .section-title i {
            color: #e74c3c;
        }

        /* ══════════════════════════════════════════════════════════════
           NETFLIX ROW SLIDERS & COMPLETE UNCROPPED POSTER CARDS
           ══════════════════════════════════════════════════════════════ */
        .slider-container {
            position: relative;
            padding: 0;
            margin-bottom: 25px;
            border-radius: 16px;
        }

        .slider {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 16px 8px 28px 8px;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .slider::-webkit-scrollbar { display: none; }

        /* Card Container with strict 2:3 ratio */
        .movie-card {
            flex: 0 0 190px;
            width: 190px;
            border-radius: 12px;
            position: relative;
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        box-shadow 0.35s ease,
                        border-color 0.35s ease;
            cursor: pointer;
            background: #151515;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            contain: layout style;
            content-visibility: auto;
            contain-intrinsic-size: 190px 285px;
        }

        /* Card Poster Container - Exact 2:3 Aspect Ratio */
        .card-poster-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 3;
            border-radius: 12px;
            overflow: hidden;
            background: #141414;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateZ(0);
            will-change: transform;
        }

        /* Whole Poster is Shown! Zero character head or title cropping! */
        .movie-card img {
            width: 100%;
            height: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            object-position: center top;
            display: block;
            transition: transform 0.4s ease, filter 0.3s ease;
        }

        /* Netflix Hover State */
        .movie-card:hover {
            transform: scale(1.08) translateY(-8px);
            z-index: 40;
            border-color: rgba(255, 107, 53, 0.45);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), 
                        0 0 30px rgba(192, 57, 43, 0.35);
        }

        .movie-card:hover img {
            filter: brightness(0.65);
            transform: scale(1.04);
        }

        /* Play button on hover */
        .movie-card .card-play-btn {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c0392b, #ff6b35);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.1rem;
            padding-left: 3px;
            box-shadow: 0 0 25px rgba(255, 107, 53, 0.7);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            pointer-events: none;
            z-index: 3;
        }

        .movie-card:hover .card-play-btn {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Card Overlay Details */
        .movie-card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 18px 12px 12px;
            background: linear-gradient(to top, rgba(13, 13, 13, 0.98) 0%, rgba(13, 13, 13, 0.75) 60%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            opacity: 0.95;
            transition: opacity 0.3s ease;
            border-radius: 0 0 12px 12px;
            z-index: 2;
        }

        .movie-card:hover .movie-card-overlay {
            opacity: 1;
            background: linear-gradient(to top, rgba(13, 13, 13, 1) 0%, rgba(13, 13, 13, 0.88) 75%, transparent 100%);
        }

        .movie-card-title {
            font-size: 0.92rem;
            font-weight: 700;
            line-height: 1.25;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
        }

        .movie-card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            color: #a39080;
        }

        .movie-card-rating {
            color: #ffd700;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .movie-card-info {
            font-size: 0.75rem;
            color: #ff6b35;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 3px;
        }

        /* Netflix Side Navigation Paddles */
        .slider-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 75%;
            max-height: 220px;
            background: rgba(13, 13, 13, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 35;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: white;
            font-size: 1.2rem;
            opacity: 0.85;
        }

        .slider-nav.prev {
            left: -6px;
            border-radius: 0 12px 12px 0;
        }

        .slider-nav.next {
            right: -6px;
            border-radius: 12px 0 0 12px;
        }

        .slider-nav:hover {
            opacity: 1;
            background: rgba(192, 57, 43, 0.75);
            border-color: rgba(255, 107, 53, 0.6);
            box-shadow: 0 0 25px rgba(192, 57, 43, 0.45);
            transform: translateY(-50%) scaleY(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(13, 13, 13, 0.9);
            
            z-index: 1000;
            overflow-y: auto;
        }

        .modal-content {
            background: rgba(26, 18, 16, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-width: 900px;
            margin: 50px auto;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(192, 57, 43, 0.05);
            animation: modalOpen 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalOpen {
            from { opacity: 0; transform: translateY(-40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-header { height: 450px; position: relative; }

        .modal-backdrop {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }

        .modal-close {
            position: absolute;
            top: 20px; right: 20px;
            width: 42px; height: 42px;
            background: rgba(13, 13, 13, 0.7);
            
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            z-index: 10;
        }

        .modal-close:hover {
            background: rgba(192, 57, 43, 0.2);
            border-color: rgba(192, 57, 43, 0.3);
            transform: rotate(90deg);
            box-shadow: 0 0 15px rgba(192, 57, 43, 0.2);
        }

        .modal-body { padding: 32px; }

        .modal-title {
            font-size: 2.2rem;
            margin-bottom: 15px;
            color: #ede0d4;
            line-height: 1.2;
            font-weight: 800;
        }

        .modal-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            color: #a39080;
            flex-wrap: wrap;
            font-size: 1rem;
        }

        .modal-rating {
            color: #ffd700;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            
        }

        .modal-description {
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 28px;
            color: #a39080;
        }

        .ai-insights {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 22px;
            border-radius: 16px;
            margin-bottom: 28px;
            border-left: 3px solid #c0392b;
            position: relative;
        }

        .ai-insights::before {
            content: '';
            position: absolute;
            top: 0; left: -3px;
            width: 3px; height: 100%;
            background: #c0392b;
            border-radius: 3px;
        }

        .ai-insights-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #e74c3c;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-content {
            line-height: 1.7;
            color: #a39080;
            font-style: italic;
        }

        .modal-footer { display: flex; gap: 15px; }

        .btn-watchlist {
            background: linear-gradient(135deg, rgba(192, 57, 43, 0.15), rgba(192, 57, 43, 0.15));
            border: 1px solid rgba(192, 57, 43, 0.2);
            color: #ede0d4;
            padding: 12px 28px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .btn-watchlist:hover {
            background: rgba(192, 57, 43, 0.12);
            border-color: rgba(192, 57, 43, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(192, 57, 43, 0.2);
        }

        .notification {
            position: fixed;
            top: 20px; right: 20px;
            padding: 14px 24px;
            background: #c0392b;
            border-radius: 14px;
            color: white;
            z-index: 2000;
            transform: translateX(120%);

    <script>
        let moviesData = {{ movies_list | tojson | safe }} || [];
        let userWatchlist = [];
        let currentMovie = null;

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function escapeJs(text) {
            if (!text) return '';
            return String(text).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        // Instant local SVG fallback so no movie poster is ever broken
        function handleImageError(img, title) {
            img.onerror = null;
            const safeTitle = encodeURIComponent((title || 'ChibiBytes Movie').slice(0, 24));
            img.src = `data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22300%22%20height%3D%22450%22%20viewBox%3D%220%200%20300%20450%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23160a0a%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%232a1010%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22300%22%20height%3D%22450%22%20fill%3D%22url(%23g)%22%2F%3E%3Ccircle%20cx%3D%22150%22%20cy%3D%22190%22%20r%3D%2238%22%20fill%3D%22%23c0392b%22%20opacity%3D%220.35%22%2F%3E%3Cpolygon%20points%3D%22142%2C175%20164%2C190%20142%2C205%22%20fill%3D%22%23ff6b35%22%2F%3E%3Ctext%20x%3D%22150%22%20y%3D%22260%22%20font-family%3D%22system-ui%2C%20sans-serif%22%20font-size%3D%2215%22%20font-weight%3D%22bold%22%20fill%3D%22%23ffffff%22%20text-anchor%3D%22middle%22%3E${safeTitle}%3C%2Ftext%3E%3Ctext%20x%3D%22150%22%20y%3D%22285%22%20font-family%3D%22system-ui%2C%20sans-serif%22%20font-size%3D%2211%22%20fill%3D%22%23a39080%22%20text-anchor%3D%22middle%22%3EChibiBytes%20Movies%3C%2Ftext%3E%3C%2Fsvg%3E`;
        }

        /* ══════════════════════════════════════════════════════════════
           NETFLIX HERO BILLBOARD SYSTEM FOR MOVIES
           ══════════════════════════════════════════════════════════════ */
        let heroSlideIndex = 0;
        let heroAutoTimer = null;
        let heroBillboardItems = [];

        function renderHeroBillboard(items) {
            const container = document.getElementById('heroBillboardSlides');
            const indicatorsContainer = document.getElementById('heroIndicators');
            if (!container || !items || items.length === 0) return;

            heroBillboardItems = items.slice(0, 8);
            container.innerHTML = '';
            if (indicatorsContainer) indicatorsContainer.innerHTML = '';

            heroBillboardItems.forEach((movie, idx) => {
                const backdrop = movie.banner_image || movie.modalimage || movie.modalImage || movie.image;
                const poster = movie.image || movie.modalimage || movie.modalImage || backdrop;
                const score = movie.rating || '8.8';
                const director = movie.director || 'Studio Masterpiece';
                const duration = movie.duration || '115 min';
                const synopsis = movie.description || 'An extraordinary anime motion picture masterpiece celebrated across the world for stunning animation and emotional storytelling.';
                const genres = Array.isArray(movie.category) ? movie.category.slice(0, 3).join(' • ') : (movie.category || 'Anime • Feature Film');
                const inWatchlist = userWatchlist.some(w => w.anime_id == movie.id);

                const slide = document.createElement('div');
                slide.className = `hero-billboard-slide ${idx === 0 ? 'active' : ''}`;
                slide.dataset.index = idx;
                slide.innerHTML = `
                    <div class="billboard-backdrop" style="background-image: url('${backdrop}');"></div>
                    <div class="billboard-vignette-h"></div>
                    <div class="billboard-vignette-v"></div>

                    <div class="billboard-content">
                        <div class="billboard-badge">
                            <span class="badge-tag"><i class="fas fa-fire"></i> #${idx + 1} TOP MOVIE</span>
                            <span class="badge-studio">${escapeHtml(director)}</span>
                        </div>
                        <h1 class="billboard-title">${escapeHtml(movie.title)}</h1>
                        <div class="billboard-meta">
                            <span class="meta-rating"><i class="fas fa-star"></i> ${score}</span>
                            <span class="meta-year">${movie.year || '2024'}</span>
                            <span class="meta-quality">4K CINEMA</span>
                            <span class="meta-eps">${escapeHtml(duration)}</span>
                            <span class="meta-genres">${escapeHtml(genres)}</span>
                        </div>
                        <p class="billboard-synopsis">${escapeHtml(synopsis)}</p>
                        <div class="billboard-actions">
                            <button class="btn-netflix-play" onclick="playHeroTrailer(${movie.id})" title="Watch official cinema trailer">
                                <i class="fas fa-play"></i> Watch Trailer
                            </button>
                            <button class="btn-netflix-info" onclick="openHeroModal(${movie.id})" title="View story synopsis & details">
                                <i class="fas fa-info-circle"></i> More Info
                            </button>
                            <button class="btn-netflix-list ${inWatchlist ? 'in-watchlist' : ''}" id="heroListBtn_${movie.id}" onclick="toggleHeroWatchlist(${movie.id})" title="Save to Watchlist">
                                <i class="fas ${inWatchlist ? 'fa-check' : 'fa-plus'}"></i> ${inWatchlist ? 'In Watchlist' : 'My List'}
                            </button>
                        </div>
                    </div>

                    <div class="billboard-showcase-poster" onclick="openHeroModal(${movie.id})" title="Click to view details for ${escapeHtml(movie.title)}">
                        <img src="${poster}" alt="${escapeHtml(movie.title)}" loading="${idx === 0 ? 'eager' : 'lazy'}" referrerpolicy="no-referrer" onerror="handleImageError(this, '${escapeJs(movie.title)}')">
                    </div>
                `;
                container.appendChild(slide);

                if (indicatorsContainer) {
                    const pill = document.createElement('div');
                    pill.className = `hero-indicator-pill ${idx === 0 ? 'active' : ''}`;
                    pill.dataset.index = idx;
                    pill.addEventListener('click', () => goToHeroSlide(idx));
                    indicatorsContainer.appendChild(pill);
                }
            });

            initHeroBillboardControls();
        }

        function initHeroBillboardControls() {
            const prevBtn = document.getElementById('heroPrevBtn');
            const nextBtn = document.getElementById('heroNextBtn');
            const billboard = document.getElementById('netflixHeroBillboard');

            if (prevBtn) prevBtn.onclick = () => prevHeroSlide();
            if (nextBtn) nextBtn.onclick = () => nextHeroSlide();

            if (billboard) {
                billboard.onmouseenter = () => clearInterval(heroAutoTimer);
                billboard.onmouseleave = () => startHeroAutoSlide();
            }

            startHeroAutoSlide();
        }

        function setHeroSlide(idx) {
            const slides = document.querySelectorAll('.hero-billboard-slide');
            const pills = document.querySelectorAll('.hero-indicator-pill');
            if (!slides.length) return;

            heroSlideIndex = (idx + slides.length) % slides.length;

            slides.forEach((s, i) => {
                s.classList.toggle('active', i === heroSlideIndex);
            });
            pills.forEach((p, i) => {
                p.classList.toggle('active', i === heroSlideIndex);
            });
        }

        function nextHeroSlide() {
            setHeroSlide(heroSlideIndex + 1);
            startHeroAutoSlide();
        }

        function prevHeroSlide() {
            setHeroSlide(heroSlideIndex - 1);
            startHeroAutoSlide();
        }

        function goToHeroSlide(idx) {
            setHeroSlide(idx);
            startHeroAutoSlide();
        }

        function startHeroAutoSlide() {
            clearInterval(heroAutoTimer);
            heroAutoTimer = setInterval(nextHeroSlide, 6500);
        }

        function playHeroTrailer(movieId) {
            const movie = moviesData.find(m => m.id === movieId);
            if (movie) openModal(movie);
        }

        function openHeroModal(movieId) {
            const movie = moviesData.find(m => m.id === movieId);
            if (movie) openModal(movie);
        }

        function toggleHeroWatchlist(movieId) {
            const movie = moviesData.find(m => m.id === movieId);
            if (!movie) return;
            const inList = userWatchlist.some(item => item.anime_id == movieId);

            if (inList) {
                fetch('/remove_from_watchlist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ anime_id: movieId, media_type: 'movie' })
                })
                .then(r => r.json())
                .then(d => {
                    if (d.status === 'success' || d.success) {
                        userWatchlist = userWatchlist.filter(item => item.anime_id != movieId);
                        showNotification(`Removed "${movie.title}" from My List`);
                        updateWatchlistUI();
                        updateBillboardWatchlistButtons();
                    }
                })
                .catch(() => {});
            } else {
                fetch('/add_to_watchlist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        anime_id: movie.id,
                        title: movie.title,
                        year: movie.year,
                        rating: movie.rating,
                        image: movie.image,
                        media_type: 'movie'
                    })
                })
                .then(r => r.json())
                .then(d => {
                    if (d.success) {
                        userWatchlist.push({ anime_id: movie.id, title: movie.title });
                        showNotification(`Added "${movie.title}" to My List`);
                        updateWatchlistUI();
                        updateBillboardWatchlistButtons();
                    }
                })
                .catch(() => {});
            }
        }

        function updateBillboardWatchlistButtons() {
            heroBillboardItems.forEach(movie => {
                const btn = document.getElementById(`heroListBtn_${movie.id}`);
                if (!btn) return;
                const inList = userWatchlist.some(item => item.anime_id == movie.id);
                btn.className = `btn-netflix-list ${inList ? 'in-watchlist' : ''}`;
                btn.innerHTML = `<i class="fas ${inList ? 'fa-check' : 'fa-plus'}"></i> ${inList ? 'In Watchlist' : 'My List'}`;
            });
        }

        function loadMoviesData() {
            if (Array.isArray(moviesData) && moviesData.length > 0) {
                moviesData = moviesData.map(item => ({
                    ...item,
                    category: typeof item.category === 'string' ? item.category.split(',').map(s => s.trim().toLowerCase()) : (item.category || [])
                }));
                renderAllMovieSliders();
            } else {
                fetch('/api/movies')
                    .then(res => res.json())
                    .then(data => {
                        if (Array.isArray(data)) {
                            moviesData = data.map(item => ({
                                ...item,
                                category: typeof item.category === 'string' ? item.category.split(',').map(s => s.trim().toLowerCase()) : (item.category || [])
                            }));
                        }
                        renderAllMovieSliders();
                    })
                    .catch(err => console.error('Error loading movies:', err));
            }
        }

        function renderAllMovieSliders() {
            const filterByCat = (cat) => moviesData.filter(m => Array.isArray(m.category) && m.category.some(c => c.includes(cat.toLowerCase())));

            // Sort by rating descending for top 8 billboard
            const topRated = [...moviesData].sort((a, b) => (parseFloat(b.rating || 0)) - (parseFloat(a.rating || 0)));
            renderHeroBillboard(topRated.slice(0, 8));

            generateSlider('featuredSlider', filterByCat('featured').length ? filterByCat('featured') : topRated.slice(0, 30));
            generateSlider('ghibliSlider',   filterByCat('ghibli').length ? filterByCat('ghibli') : moviesData.slice(0, 30));
            generateSlider('awardSlider',    filterByCat('award').length ? filterByCat('award') : moviesData.slice(0, 30));
            generateSlider('adventureSlider', filterByCat('adventure').length ? filterByCat('adventure') : moviesData.slice(0, 30));
            generateSlider('actionSlider',   filterByCat('action').length ? filterByCat('action') : moviesData.slice(0, 30));
            generateSlider('romanceSlider', filterByCat('romance').length ? filterByCat('romance') : moviesData.slice(0, 30));
            generateSlider('dramaSlider',   filterByCat('drama').length ? filterByCat('drama') : moviesData.slice(0, 30));
            generateSlider('fantasySlider', filterByCat('fantasy').length ? filterByCat('fantasy') : moviesData.slice(0, 30));
            generateSlider('newSlider',     filterByCat('new').length ? filterByCat('new') : moviesData.slice(0, 30));
        }

        function generateSlider(sliderId, list) {
            const slider = document.getElementById(sliderId);
            if (!slider) return;
            slider.innerHTML = '';
            list.forEach(m => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                const imgSrc = m.image || m.modalimage || m.modalImage || 'https://s4.anilist.co/file/anilistcdn/media/anime/cover/medium/default.jpg';
                card.innerHTML = `
                    <div class="card-poster-wrap">
                        <img src="${imgSrc}" alt="${escapeHtml(m.title)}" loading="lazy" referrerpolicy="no-referrer" onerror="handleImageError(this, '${escapeJs(m.title)}')">
                        <div class="card-play-overlay">
                            <div class="play-pulse-btn" title="Watch Trailer"><i class="fas fa-play"></i></div>
                        </div>
                        <div class="movie-card-overlay">
                            <div class="movie-card-title" title="${escapeHtml(m.title)}">${escapeHtml(m.title)}</div>
                            <div class="movie-card-meta">
                                <span>${m.year || '2024'}</span>
                                <span class="movie-card-rating">${m.rating || '8.5'} <i class="fas fa-star"></i></span>
                            </div>
                            <div class="movie-card-info">${escapeHtml(m.duration || '110 min')} • ${escapeHtml(m.director || 'Anime')}</div>
                        </div>
                    </div>
                `;
                card.addEventListener('click', () => openModal(m));
                slider.appendChild(card);
            });
        }

        function setupSliderNavigation() {
            document.querySelectorAll('.slider-nav.next').forEach(btn => {
                btn.onclick = function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const slider = this.parentElement.querySelector('.slider');
                    if (slider) {
                        const scrollAmount = Math.max(320, Math.floor(slider.clientWidth * 0.75));
                        slider.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                    }
                };
            });
            document.querySelectorAll('.slider-nav.prev').forEach(btn => {
                btn.onclick = function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const slider = this.parentElement.querySelector('.slider');
                    if (slider) {
                        const scrollAmount = Math.max(320, Math.floor(slider.clientWidth * 0.75));
                        slider.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
                    }
                };
            });
        }

        const modal = document.getElementById('infoModal') || document.getElementById('movieModal');
        const modalClose = document.getElementById('modalClose');
        const modalTitle = document.getElementById('modalTitle');
        const modalBackdrop = document.getElementById('modalBackdrop');
        const modalDesc = document.getElementById('modalDescription');
        const aiContent = document.getElementById('aiContent');
        const modalMeta = document.getElementById('modalMeta');
        const addToWatchlistBtn = document.getElementById('addToWatchlist') || document.getElementById('addToWatchlistBtn');
        const notification = document.getElementById('notification');
        const notificationText = document.getElementById('notificationText');

        function handleCinemaBackdrop(e) {
            if (e.target.classList.contains('cinema-modal') || e.target.classList.contains('cinema-modal-backdrop')) {
                closeModal();
            }
        }

        function fetchWatchlist() {
            return fetch('/get_watchlist')
                .then(res => res.json())
                .then(data => {
                    userWatchlist = data;
                    updateWatchlistUI();
                    updateBillboardWatchlistButtons();
                })
                .catch(err => console.error('Error fetching watchlist:', err));
        }

        function updateWatchlistUI() {
            if (!addToWatchlistBtn) return;
            if (currentMovie && userWatchlist.some(item => item.anime_id == currentMovie.id)) {
                addToWatchlistBtn.innerHTML = '<i class="fas fa-check"></i> Already in Watchlist';
                addToWatchlistBtn.disabled = true;
                addToWatchlistBtn.style.opacity = '0.6';
                addToWatchlistBtn.style.cursor = 'not-allowed';
            } else {
                addToWatchlistBtn.innerHTML = '<i class="fas fa-plus"></i> Add to Watchlist';
                addToWatchlistBtn.disabled = false;
                addToWatchlistBtn.style.opacity = '1';
                addToWatchlistBtn.style.cursor = 'pointer';
            }
        }

        function openModal(m) {
            currentMovie = m;
            const modalEl = document.getElementById('infoModal');
            if (modalEl && modalEl.parentElement !== document.body) {
                document.body.appendChild(modalEl);
            }

            if (modalTitle) modalTitle.textContent = m.title;
            const jpEl = document.getElementById('modalJpTitle');
            if (jpEl) {
                const jp = m.japanese_title || m.title_japanese;
                if (jp) {
                    jpEl.textContent = jp;
                    jpEl.style.display = 'block';
                } else {
                    jpEl.style.display = 'none';
                }
            }

            if (modalDesc) modalDesc.textContent = m.description || '';
            const insightsWrap = document.getElementById('modalInsightsWrap');
            if (insightsWrap && aiContent) {
                if (m.insights) {
                    aiContent.textContent = m.insights;
                    insightsWrap.style.display = 'block';
                } else {
                    insightsWrap.style.display = 'none';
                }
            }

            if (modalMeta) {
                const metaParts = [
                    `<span>${m.year || '2024'}</span>`,
                    `<span>${m.duration || 'Movie'}</span>`,
                    `<span style="color: #ffd700; font-weight: 700;"><i class="fas fa-star"></i> ${m.rating || '8.8'}</span>`
                ];
                if (m.director) metaParts.push(`<span>Dir. ${escapeHtml(m.director)}</span>`);
                modalMeta.innerHTML = metaParts.join(' • ');
            }

            const genresWrap = document.getElementById('modalGenres');
            if (genresWrap) {
                const cats = Array.isArray(m.category) 
                    ? m.category 
                    : (m.category || m.genre || 'Movie').split(',').map(s => s.trim()).filter(Boolean);
                genresWrap.innerHTML = cats.map(c => `<span class="card-genre-pill" style="max-width: none; font-size: 0.8rem; padding: 4px 12px;">${escapeHtml(c)}</span>`).join('');
            }

            const trailerIframe = document.getElementById('modalTrailerIframe');
            const ytBtn = document.getElementById('moviesDirectYoutubeBtn');
            const playerWrapper = document.getElementById('modalPlayerWrapper');

            if (m.trailer_youtube_id) {
                if (trailerIframe) {
                    trailerIframe.style.display = 'block';
                    trailerIframe.src = `https://www.youtube-nocookie.com/embed/${m.trailer_youtube_id}?autoplay=1&enablejsapi=1&rel=0`;
                }
                if (modalBackdrop) modalBackdrop.style.display = 'none';
                if (playerWrapper) playerWrapper.style.display = 'block';
                if (ytBtn) {
                    ytBtn.href = `https://www.youtube.com/watch?v=${m.trailer_youtube_id}`;
                    ytBtn.style.display = 'inline-flex';
                }
            } else {
                if (trailerIframe) {
                    trailerIframe.style.display = 'none';
                    trailerIframe.src = '';
                }
                const banner = m.banner_image || m.modalimage || m.modalImage || m.image;
                if (modalBackdrop) {
                    modalBackdrop.src = banner;
                    modalBackdrop.alt = m.title;
                    modalBackdrop.style.display = 'block';
                }
                if (playerWrapper) playerWrapper.style.display = 'block';
                if (ytBtn) ytBtn.style.display = 'none';
            }

            updateWatchlistUI();
            if (modalEl) {
                modalEl.classList.add('active');
                modalEl.style.display = 'flex';
                const dialog = modalEl.querySelector('.cinema-modal-dialog');
                if (dialog) dialog.scrollTop = 0;
                document.body.style.overflow = 'hidden';
            }
        }

        function closeModal() {
            const trailerIframe = document.getElementById('modalTrailerIframe');
            if (trailerIframe) {
                trailerIframe.src = '';
                trailerIframe.style.display = 'none';
            }
            const ytBtn = document.getElementById('moviesDirectYoutubeBtn');
            if (ytBtn) ytBtn.style.display = 'none';

            const modalEl = document.getElementById('infoModal');
            if (modalEl) {
                modalEl.classList.remove('active');
                modalEl.style.display = 'none';
            }
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        function addToWatchlist() {
            if (!currentMovie) return;
            showNotification(`${currentMovie.title} added to watchlist!`);
            fetch('/add_to_watchlist', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    anime_id: currentMovie.id,
                    title:    currentMovie.title,
                    year:     currentMovie.year,
                    rating:   currentMovie.rating,
                    image:    currentMovie.image,
                    media_type: 'movie'
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    userWatchlist.push({ anime_id: currentMovie.id, title: currentMovie.title, media_type: 'movie' });
                    updateWatchlistUI();
                    updateBillboardWatchlistButtons();
                } else if (data.error && data.error !== 'Already in watchlist') {
                    showNotification(data.error);
                }
            })
            .catch(() => {});
        }

        function showNotification(msg) {
            if (!notification || !notificationText) return;
            notificationText.textContent = msg;
            notification.classList.add('show');
            setTimeout(() => notification.classList.remove('show'), 3000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadMoviesData();
            setupSliderNavigation();
            fetchWatchlist();

            if (modalClose) modalClose.addEventListener('click', closeModal);
            if (addToWatchlistBtn) addToWatchlistBtn.addEventListener('click', addToWatchlist);
            if (modal) modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
        });

        // Browser back/forward navigation recovery
        window.addEventListener('pageshow', function() {
            closeModal();
            document.body.style.overflow = '';
            fetchWatchlist();
        });
    </script>
</body>
</html>
{% endblock %}
