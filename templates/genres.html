{% extends "main-app.html" %}

{% block content %}

</html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChibiBytes - Anime Genres</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        .page-header {
            padding: 35px 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(192, 57, 43, 0.08) 0%, rgba(13, 13, 13, 0) 100%);
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
        }

        .page-header::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #c0392b, #ff6b35, #c0392b);
            background-size: 200% auto;
            animation: shimmerLine 3s linear infinite;
        }

        .page-title {
            font-size: 2.6rem;
            margin-bottom: 10px;
            color: #ede0d4;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .page-title i {
            color: #ff6b35;
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.4);
        }

        .genre-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: rgba(192, 57, 43, 0.15);
            border: 1px solid rgba(192, 57, 43, 0.3);
            border-radius: 20px;
            color: #ff6b35;
            font-size: 0.88rem;
            font-weight: 600;
            margin-top: 10px;
        }

        .genre-filter {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 15px 20px;
            margin-bottom: 30px;
            max-width: 1300px;
            margin-left: auto;
            margin-right: auto;
        }

        .genre-btn {
            background: rgba(38, 26, 21, 0.8);
            border: 1px solid rgba(192, 57, 43, 0.2);
            color: #ede0d4;
            padding: 10px 22px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            font-size: 0.92rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
            user-select: none;
        }

        .genre-btn i {
            color: #ff6b35;
            transition: transform 0.3s ease;
        }

        .genre-btn:hover {
            transform: translateY(-3px);
            background: rgba(192, 57, 43, 0.25);
            border-color: rgba(255, 107, 53, 0.5);
            color: #fff;
            box-shadow: 0 6px 20px rgba(192, 57, 43, 0.25);
        }

        .genre-btn:hover i {
            transform: scale(1.2);
        }

        .genre-btn.active {
            background: linear-gradient(135deg, #c0392b 0%, #e74c3c 100%);
            color: #fff;
            border-color: #ff6b35;
            box-shadow: 0 6px 22px rgba(192, 57, 43, 0.45);
        }

        .genre-btn.active i {
            color: #fff;
        }

        .section {
            margin-bottom: 45px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.4rem;
            margin-bottom: 18px;
            color: #ede0d4;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            letter-spacing: 0.3px;
        }

        .section-title i {
            color: #ff6b35;
            font-size: 1.2rem;
        }

        .slider-container {
            position: relative;
            overflow: hidden;
            border-radius: 18px;
            background: rgba(26, 18, 16, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px;
        }

        .slider {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding: 10px 5px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .slider::-webkit-scrollbar {
            display: none;
        }

        .anime-card {
            flex: 0 0 190px;
            width: 190px;
            border-radius: 12px;
            position: relative;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            background: rgba(26, 18, 16, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            contain: layout style;
            content-visibility: auto;
            contain-intrinsic-size: 190px 285px;
        }

        .anime-card:hover {
            transform: translateY(-8px) scale(1.05);
            z-index: 10;
            border-color: rgba(255, 107, 53, 0.45);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), 0 0 25px rgba(192, 57, 43, 0.3);
        }

        /* Card Poster Container - Exact 2:3 Aspect Ratio */
        .card-poster-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 3;
            border-radius: 12px;
            overflow: hidden;
            background: #141414;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateZ(0);
            will-change: transform;
        }

        /* 100% Uncropped Poster Display */
        .anime-card img {
            width: 100%;
            height: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            object-position: center top;
            display: block;
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        .anime-card:hover img {
            transform: scale(1.04);
            filter: brightness(0.7);
        }

        /* Overlay Always Visible for Titles & Ratings */
        .anime-card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(13, 13, 13, 0.92) 0%, rgba(13, 13, 13, 0.5) 45%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px;
            opacity: 1;
            transition: background 0.3s ease;
        }

        .anime-card-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .anime-card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #a39080;
            font-weight: 600;
        }

        .anime-card-rating {
            color: #f1c40f;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.6);
            padding: 3px 8px;
            border-radius: 12px;
            border: 1px solid rgba(241, 196, 15, 0.2);
        }

        .card-play-btn {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c0392b, #ff6b35);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.1rem;
            padding-left: 3px;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.6);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 3;
            pointer-events: none;
        }

        .anime-card:hover .card-play-btn {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .slider-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            background: rgba(13, 13, 13, 0.85);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ede0d4;
            font-size: 1rem;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
        }

        .slider-nav:hover {
            background: #c0392b;
            border-color: #ff6b35;
            color: #fff;
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 8px 24px rgba(192, 57, 43, 0.5);
        }

        .slider-nav.prev {
            left: 10px;
        }

        .slider-nav.next {
            right: 10px;
        }

        .slider-nav i {
            pointer-events: none;
        }

        /* Modal Overlay Styling */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 13, 13, 0.9);
            backdrop-filter: blur(12px);
            z-index: 2000;
            overflow-y: auto;
        }

        .modal-content {
            background: rgba(26, 18, 16, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 900px;
            margin: 50px auto;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(192, 57, 43, 0.1);
            animation: modalOpen 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalOpen {
            from { opacity: 0; transform: translateY(-40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-header {
            height: 380px;
            position: relative;
        }

        .modal-backdrop {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 42px;
            height: 42px;
            background: rgba(13, 13, 13, 0.7);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            z-index: 10;
        }

        .modal-close:hover {
            background: rgba(192, 57, 43, 0.2);
            border-color: rgba(192, 57, 43, 0.3);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 32px;
        }

        .modal-title {
            font-size: 2.2rem;
            margin-bottom: 15px;
            color: #ede0d4;
            line-height: 1.2;
            font-weight: 800;
        }

        .modal-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            color: #a39080;
            font-size: 0.95rem;
            align-items: center;
        }

        .modal-rating {
            color: #ffd700;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .modal-description {
            line-height: 1.7;
            margin-bottom: 25px;
            color: #a39080;
            font-size: 1rem;
        }

        .ai-insights {
            background: rgba(38, 26, 21, 0.6);
            padding: 22px;
            border-radius: 16px;
            margin-bottom: 28px;
            border-left: 3px solid #c0392b;
            position: relative;
        }

        .ai-insights-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #e74c3c;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-content {
            line-height: 1.7;
            color: #a39080;
            font-size: 0.95rem;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
        }

        .btn-watchlist {
            background: #c0392b;
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-watchlist:hover {
            background: #e74c3c;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(192, 57, 43, 0.4);
        }

        /* Toast Notification Styling */
        .notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(38, 26, 21, 0.95);
            border: 1px solid rgba(192, 57, 43, 0.4);
            border-left: 4px solid #ff6b35;
            color: #ede0d4;
            padding: 15px 25px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 2000;
            pointer-events: none;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        .notification i {
            color: #ff6b35;
            font-size: 1.2rem;
        }
    </style>
</head>

    <!-- Cinema Trailer Modal (Trending Theme) -->
    <div class="cinema-modal" id="infoModal" onclick="handleCinemaBackdrop(event)">
        <div class="cinema-modal-backdrop"></div>
        <div class="cinema-modal-dialog">
            <button class="cinema-close-btn" id="modalClose" onclick="closeModal()" title="Close Trailer">&times;</button>
            <div class="cinema-player-wrapper" id="modalPlayerWrapper">
                <iframe id="modalTrailerIframe" class="modal-trailer-iframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                <img src="" alt="" class="modal-backdrop" id="modalBackdrop" style="width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; display: none;">
            </div>
            <div class="cinema-details-trending">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap;">
                    <div>
                        <h3 id="modalTitle">Anime Title</h3>
                        <p id="modalJpTitle" style="color: #ff6b35; font-size: 0.88rem; font-weight: 600; margin-top: 2px; display: none;"></p>
                        <p id="modalMeta" style="color: #a39080; font-size: 0.92rem; margin: 8px 0;"></p>
                    </div>
                    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                        <button class="btn-watchlist" id="addToWatchlist">
                            <i class="fas fa-plus"></i> Add to Watchlist
                        </button>
                        <a id="genresDirectYoutubeBtn" href="#" target="_blank" rel="noopener noreferrer" style="display: none; background: rgba(192, 57, 43, 0.25); border: 1px solid rgba(255, 107, 53, 0.4); color: #ede0d4; padding: 8px 16px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; text-decoration: none; align-items: center; gap: 8px;">
                            <i class="fab fa-youtube" style="color: #ff4757;"></i> YouTube ↗
                        </a>
                    </div>
                </div>
                <div id="modalGenres" style="display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0;"></div>
                <p id="modalDescription" style="color: #ede0d4; font-size: 0.95rem; line-height: 1.6; margin-top: 12px;"></p>
                <div id="modalInsightsWrap" style="margin-top: 16px; padding: 14px 18px; background: rgba(192, 57, 43, 0.12); border: 1px solid rgba(255, 107, 53, 0.25); border-radius: 12px;">
                    <h4 style="color: #ff6b35; font-size: 0.88rem; display: flex; align-items: center; gap: 6px; margin: 0 0 6px 0;">
                        <i class="fas fa-sparkles"></i> Insights & Trivia
                    </h4>
                    <p id="aiContent" style="color: #a39080; font-size: 0.88rem; line-height: 1.5; margin: 0;"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification">
        <i class="fas fa-check-circle"></i>
        <span id="notificationText"></span>
    </div>

    <script>
        let animeData = {{ anime_list | tojson | safe }} || [];

        function loadGenresData() {
            if (Array.isArray(animeData) && animeData.length > 0) {
                animeData = animeData.map(item => ({
                    ...item,
                    genres: typeof item.category === 'string' ? item.category.split(',').map(s => s.trim()) : (item.category || [])
                }));
                renderGenreSliders();
            } else {
                fetch('/api/anime')
                    .then(res => res.json())
                    .then(data => {
                        if (Array.isArray(data)) {
                            animeData = data.map(item => ({
                                ...item,
                                genres: typeof item.category === 'string' ? item.category.split(',').map(s => s.trim()) : (item.category || [])
                            }));
                        }
                        renderGenreSliders();
                    })
                    .catch(err => console.error('Error loading genres:', err));
            }
        }

        const genres = [
            { id: 'shonen', name: 'Shonen', icon: 'fa-fist-raised' },
            { id: 'shojo', name: 'Shojo', icon: 'fa-heart' },
            { id: 'seinen', name: 'Seinen', icon: 'fa-glasses' },
            { id: 'action', name: 'Action', icon: 'fa-explosion' },
            { id: 'adventure', name: 'Adventure', icon: 'fa-mountain-sun' },
            { id: 'comedy', name: 'Comedy', icon: 'fa-face-laugh-squint' },
            { id: 'drama', name: 'Drama', icon: 'fa-masks-theater' },
            { id: 'fantasy', name: 'Fantasy', icon: 'fa-dragon' },
            { id: 'mystery', name: 'Mystery', icon: 'fa-magnifying-glass' },
            { id: 'romance', name: 'Romance', icon: 'fa-heart' },
            { id: 'sports', name: 'Sports', icon: 'fa-baseball' },
            { id: 'supernatural', name: 'Supernatural', icon: 'fa-ghost' }
        ];

        function renderGenreSliders() {
            genres.forEach(genre => {
                const filtered = animeData.filter(anime =>
                    Array.isArray(anime.genres) && anime.genres.some(g => g.toLowerCase().includes(genre.name.toLowerCase()))
                );
                generateSlider(`${genre.id}Slider`, filtered.length ? filtered : animeData.slice(0, 15));
            });
        }

        const modal = document.getElementById('infoModal') || document.getElementById('animeModal');
        const modalClose = document.getElementById('modalClose');
        const modalTitle = document.getElementById('modalTitle');
        const modalBackdrop = document.getElementById('modalBackdrop');
        const modalDescription = document.getElementById('modalDescription');
        const aiContent = document.getElementById('aiContent');
        const modalMeta = document.getElementById('modalMeta');
        const addToWatchlistBtn = document.getElementById('addToWatchlist') || document.getElementById('addToWatchlistBtn');
        const notification = document.getElementById('notification');
        const notificationText = document.getElementById('notificationText');
        const genreFilter = document.getElementById('genreFilter');

        let currentAnime = null;
        let userWatchlist = [];

        function fetchWatchlist() {
            return fetch('/get_watchlist')
                .then(res => res.json())
                .then(data => {
                    userWatchlist = data;
                    updateWatchlistUI();
                })
                .catch(err => console.error('Error fetching watchlist:', err));
        }

        function updateWatchlistUI() {
            if (!addToWatchlistBtn) return;
            if (currentAnime && userWatchlist.some(item => item.anime_id == currentAnime.id)) {
                addToWatchlistBtn.innerHTML = '<i class="fas fa-check"></i> Already in Watchlist';
                addToWatchlistBtn.disabled = true;
                addToWatchlistBtn.style.opacity = '0.6';
                addToWatchlistBtn.style.cursor = 'not-allowed';
            } else {
                addToWatchlistBtn.innerHTML = '<i class="fas fa-plus"></i> Add to Watchlist';
                addToWatchlistBtn.disabled = false;
                addToWatchlistBtn.style.opacity = '1';
                addToWatchlistBtn.style.cursor = 'pointer';
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            generateGenreFilter();
            loadGenresData();
            fetchWatchlist();

            if (modalClose) modalClose.addEventListener('click', closeModal);
            if (addToWatchlistBtn) addToWatchlistBtn.addEventListener('click', addToWatchlist);

            if (modal) {
                modal.addEventListener('click', function (e) {
                    if (e.target === modal) {
                        closeModal();
                    }
                });
            }

            setupSliderNavigation();
        });

        function generateGenreFilter() {
            if (!genreFilter) return;
            genreFilter.innerHTML = '';

            const allBtn = document.createElement('button');
            allBtn.className = 'genre-btn active';
            allBtn.innerHTML = `<i class="fas fa-layer-group genre-icon"></i> All`;
            allBtn.addEventListener('click', () => {
                document.querySelectorAll('.genre-btn').forEach(btn => btn.classList.remove('active'));
                allBtn.classList.add('active');
                document.querySelectorAll('.section').forEach(sec => sec.style.display = 'block');
            });
            genreFilter.appendChild(allBtn);

            genres.forEach(genre => {
                const button = document.createElement('button');
                button.className = 'genre-btn';
                button.innerHTML = `<i class="fas ${genre.icon} genre-icon"></i> ${genre.name}`;
                button.addEventListener('click', () => {
                    const isAlreadyActive = button.classList.contains('active');
                    document.querySelectorAll('.genre-btn').forEach(btn => btn.classList.remove('active'));

                    if (isAlreadyActive) {
                        allBtn.classList.add('active');
                        document.querySelectorAll('.section').forEach(sec => sec.style.display = 'block');
                    } else {
                        button.classList.add('active');
                        document.querySelectorAll('.section').forEach(sec => {
                            if (sec.id === `${genre.id}Section`) {
                                sec.style.display = 'block';
                            } else {
                                sec.style.display = 'none';
                            }
                        });
                    }
                });
                genreFilter.appendChild(button);
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function escapeJs(text) {
            if (!text) return '';
            return String(text).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        function handleImageError(img, title) {
            img.onerror = null;
            const safeTitle = encodeURIComponent((title || 'ChibiBytes Anime').slice(0, 24));
            img.src = `data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22300%22%20height%3D%22450%22%20viewBox%3D%220%200%20300%20450%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23160a0a%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%232a1010%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22300%22%20height%3D%22450%22%20fill%3D%22url(%23g)%22%2F%3E%3Ccircle%20cx%3D%22150%22%20cy%3D%22190%22%20r%3D%2238%22%20fill%3D%22%23c0392b%22%20opacity%3D%220.35%22%2F%3E%3Cpolygon%20points%3D%22142%2C175%20164%2C190%20142%2C205%22%20fill%3D%22%23ff6b35%22%2F%3E%3Ctext%20x%3D%22150%22%20y%3D%22260%22%20font-family%3D%22system-ui%2C%20sans-serif%22%20font-size%3D%2215%22%20font-weight%3D%22bold%22%20fill%3D%22%23ffffff%22%20text-anchor%3D%22middle%22%3E${safeTitle}%3C%2Ftext%3E%3Ctext%20x%3D%22150%22%20y%3D%22285%22%20font-family%3D%22system-ui%2C%20sans-serif%22%20font-size%3D%2211%22%20fill%3D%22%23a39080%22%20text-anchor%3D%22middle%22%3EChibiBytes%20Genre%3C%2Ftext%3E%3C%2Fsvg%3E`;
        }

        function generateSlider(sliderId, animeList) {
            const slider = document.getElementById(sliderId);
            if (!slider) return;
            slider.innerHTML = '';

            animeList.forEach(anime => {
                const card = document.createElement('div');
                card.className = 'anime-card';
                const imgSrc = anime.image || anime.modalImage || 'https://s4.anilist.co/file/anilistcdn/media/anime/cover/medium/default.jpg';
                card.innerHTML = `
                    <div class="card-poster-wrap">
                        <img src="${imgSrc}" alt="${escapeHtml(anime.title)}" loading="lazy" referrerpolicy="no-referrer" onerror="handleImageError(this, '${escapeJs(anime.title)}')">
                        <div class="card-play-overlay">
                            <div class="play-pulse-btn" title="Watch Trailer"><i class="fas fa-play"></i></div>
                        </div>
                        <div class="anime-card-overlay">
                            <div class="anime-card-title">${escapeHtml(anime.title)}</div>
                            <div class="anime-card-meta">
                                <span>${anime.year || '2024'}</span>
                                <span class="anime-card-rating">${anime.rating || '8.5'} <i class="fas fa-star"></i></span>
                            </div>
                        </div>
                    </div>
                `;
                card.addEventListener('click', () => openModal(anime));
                slider.appendChild(card);
            });
        }

        function handleCinemaBackdrop(e) {
            if (e.target.classList.contains('cinema-modal') || e.target.classList.contains('cinema-modal-backdrop')) {
                closeModal();
            }
        }

        function openModal(anime) {
            currentAnime = anime;
            const modalEl = document.getElementById('infoModal');
            if (modalEl && modalEl.parentElement !== document.body) {
                document.body.appendChild(modalEl);
            }

            if (modalTitle) modalTitle.textContent = anime.title;
            const jpEl = document.getElementById('modalJpTitle');
            if (jpEl) {
                const jp = anime.japanese_title || anime.title_japanese;
                if (jp) {
                    jpEl.textContent = jp;
                    jpEl.style.display = 'block';
                } else {
                    jpEl.style.display = 'none';
                }
            }

            if (modalDescription) modalDescription.textContent = anime.description || 'No synopsis available.';
            const insightsWrap = document.getElementById('modalInsightsWrap');
            if (insightsWrap && aiContent) {
                if (anime.insights) {
                    aiContent.textContent = anime.insights;
                    insightsWrap.style.display = 'block';
                } else {
                    insightsWrap.style.display = 'none';
                }
            }

            if (modalMeta) {
                const metaParts = [
                    `<span>${anime.year || '2024'}</span>`,
                    `<span>${anime.episodes ? anime.episodes + ' eps' : 'Series'}</span>`,
                    `<span style="color: #ffd700; font-weight: 700;"><i class="fas fa-star"></i> ${anime.rating || '8.5'}</span>`
                ];
                if (anime.studio) metaParts.push(`<span>${escapeHtml(anime.studio)}</span>`);
                modalMeta.innerHTML = metaParts.join(' • ');
            }

            const genresWrap = document.getElementById('modalGenres');
            if (genresWrap) {
                const cats = Array.isArray(anime.category) 
                    ? anime.category 
                    : (anime.category || 'Anime').split(',').map(s => s.trim()).filter(Boolean);
                genresWrap.innerHTML = cats.map(c => `<span class="card-genre-pill" style="max-width: none; font-size: 0.8rem; padding: 4px 12px;">${escapeHtml(c)}</span>`).join('');
            }

            const trailerIframe = document.getElementById('modalTrailerIframe');
            const ytBtn = document.getElementById('genresDirectYoutubeBtn');
            const playerWrapper = document.getElementById('modalPlayerWrapper');

            if (anime.trailer_youtube_id) {
                if (trailerIframe) {
                    trailerIframe.style.display = 'block';
                    trailerIframe.src = `https://www.youtube-nocookie.com/embed/${anime.trailer_youtube_id}?autoplay=1&enablejsapi=1&rel=0`;
                }
                if (modalBackdrop) modalBackdrop.style.display = 'none';
                if (playerWrapper) playerWrapper.style.display = 'block';
                if (ytBtn) {
                    ytBtn.href = `https://www.youtube.com/watch?v=${anime.trailer_youtube_id}`;
                    ytBtn.style.display = 'inline-flex';
                }
            } else {
                if (trailerIframe) {
                    trailerIframe.style.display = 'none';
                    trailerIframe.src = '';
                }
                const banner = anime.banner_image || anime.modalimage || anime.modalImage || anime.image;
                if (modalBackdrop) {
                    modalBackdrop.src = banner;
                    modalBackdrop.alt = anime.title;
                    modalBackdrop.style.display = 'block';
                }
                if (playerWrapper) playerWrapper.style.display = 'block';
                if (ytBtn) ytBtn.style.display = 'none';
            }

            updateWatchlistUI();
            if (modalEl) {
                modalEl.classList.add('active');
                modalEl.style.display = 'flex';
                const dialog = modalEl.querySelector('.cinema-modal-dialog');
                if (dialog) dialog.scrollTop = 0;
                document.body.style.overflow = 'hidden';
            }
        }

        function closeModal() {
            const trailerIframe = document.getElementById('modalTrailerIframe');
            if (trailerIframe) {
                trailerIframe.src = '';
                trailerIframe.style.display = 'none';
            }
            const ytBtn = document.getElementById('genresDirectYoutubeBtn');
            if (ytBtn) ytBtn.style.display = 'none';

            const modalEl = document.getElementById('infoModal');
            if (modalEl) {
                modalEl.classList.remove('active');
                modalEl.style.display = 'none';
            }
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        function addToWatchlist() {
            if (!currentAnime) return;
            showNotification(`${currentAnime.title} added to your watchlist!`);
            fetch('/add_to_watchlist', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    anime_id: currentAnime.id,
                    title: currentAnime.title,
                    year: currentAnime.year,
                    rating: currentAnime.rating,
                    image: currentAnime.image,
                    media_type: 'anime'
                })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        userWatchlist.push({ anime_id: currentAnime.id, media_type: 'anime' });
                        updateWatchlistUI();
                    } else if (data.error && data.error !== 'Already in watchlist') {
                        showNotification(data.error);
                    }
                })
                .catch(() => { });
        }

        function showNotification(message) {
            if (!notification || !notificationText) return;
            notificationText.textContent = message;
            notification.classList.add('show');
            setTimeout(() => notification.classList.remove('show'), 3000);
        }

        function setupSliderNavigation() {
            document.querySelectorAll('.slider-nav.next').forEach(button => {
                button.onclick = function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const slider = this.parentElement.querySelector('.slider');
                    if (slider) {
                        const scrollAmount = Math.max(320, Math.floor(slider.clientWidth * 0.75));
                        slider.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                    }
                };
            });
            document.querySelectorAll('.slider-nav.prev').forEach(button => {
                button.onclick = function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const slider = this.parentElement.querySelector('.slider');
                    if (slider) {
                        const scrollAmount = Math.max(320, Math.floor(slider.clientWidth * 0.75));
                        slider.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
                    }
                };
            });
        }

        // Browser back/forward navigation recovery
        window.addEventListener('pageshow', function() {
            closeModal();
            document.body.style.overflow = '';
            fetchWatchlist();
        });
    </script>
</body>

</html>
{% endblock %}
